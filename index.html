    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;

            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;

            --text-muted: #9ca3af;

            margin: 0;
            padding: 0;

            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(3, 105, 161, 0.4);
            letter-spacing: 0.5px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 35px;
            background: linear-gradient(135deg, #111827, #0f172a);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        header h1 {
            font-size: 2.8rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }
        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
        }
        .search-container {
            max-width: 700px;
            margin: 0 auto 40px auto;
        }
        .search-input {
            width: 100%;
            padding: 16px 22px;
            font-size: 1.15rem;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        .category-section {
            margin-bottom: 50px;
        }
        .category-title {
            font-size: 1.9rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
        }
        .mod-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .mod-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
            border-color: var(--accent-color);
            background-color: var(--card-hover);
        }
        .mod-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .mod-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-main);
        }
        .mod-loader {
            font-size: 0.75rem;
            background: var(--badge-bg);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            white-space: nowrap;
        }
        .mod-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .mod-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .mod-version {
            background: rgba(156, 163, 175, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }
        footer.site-footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            background-color: #0b1120;
            border-radius: 16px;
        }
        footer.site-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        footer.site-footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
    </style>

        function renderCategories() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = '';

            categories.forEach(cat => {
                let sectionHTML = `
                    <section class="category-section" id="${cat.id}">
                        <h2 class="category-title">${cat.name}</h2>
                        <div class="mods-grid">
                `;

                cat.mods.forEach(mod => {
                    sectionHTML += `
                        <div class="mod-card" data-name="${mod.name.toLowerCase()}">
                            <div>
                                <div class="mod-header">
                                    <span class="mod-name">${mod.name}</span>
                                    <span class="mod-loader">${mod.loader}</span>
                                </div>
                                <p class="mod-desc">${mod.desc}</p>
                            </div>
                            <div class="mod-footer">
                                <span>Version Support</span>
                                <span class="mod-version">${mod.version}</span>
                            </div>
                        </div>
                    `;
                });

                sectionHTML += `</div></section>`;
                container.innerHTML += sectionHTML;
            });
        }

        function filterMods() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.mod-card');

            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(query)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }
